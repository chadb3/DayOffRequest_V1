name: Security Audit

# Runs `composer audit` against known security advisories.
#
# NOTE: push/PR triggers currently target "Kiro-Modernization" (the active
# modernization branch). When modernization merges and the default branch
# becomes "main", update the branch names below (see MODERNIZATION_NOTES.md).
on:
  schedule:
    - cron: "0 7 * * 1"          # Mondays 07:00 UTC
  push:
    branches: [Kiro-Modernization]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  issues: write                   # required to open an issue on findings

jobs:
  composer-audit:
    name: composer audit (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.5']
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: sqlite3, mbstring
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run composer audit
        id: audit
        run: composer audit --no-interaction --format=plain | tee audit-report.txt
        continue-on-error: true

      # Scheduled / push / manual runs: open a tracking issue on findings.
      - name: Open issue if vulnerabilities found
        if: ${{ steps.audit.outcome == 'failure' && github.event_name != 'pull_request' }}
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: "Security advisory detected by composer audit"
          content-filepath: audit-report.txt
          labels: security, dependencies

      # Pull requests: fail the check instead of opening an issue.
      - name: Fail the PR check if vulnerabilities found
        if: ${{ steps.audit.outcome == 'failure' && github.event_name == 'pull_request' }}
        run: |
          echo "composer audit found vulnerabilities (see report above)."
          exit 1
